[project]
name = "replace"
version = "0.1.0"
description = "RePlAce global placement in PyTorch"
readme = "README.md"
authors = [
    { name = "scascino404", email = "scascino4@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "torch>=2.14.1",
]

[project.scripts]
replace = "replace:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# Use CPU-only PyTorch wheels (no multi-GB CUDA downloads).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
